<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Affichage Temps Réel Transport</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f6f7fb; margin:0; }
    .arret-block { background: #181c92; color: #fff; margin: 20px auto; border-radius: 12px; max-width: 900px; padding: 24px 32px 24px 32px; box-shadow: 0 8px 36px #181c9233;}
    .arret-title { font-size: 2.5em; font-weight: bold; margin-bottom: 10px; letter-spacing: 1px;}
    .ligne-title { font-size: 2em; color: #ffdc47; margin-bottom: 6px;}
    .horaire-ligne {margin-bottom: 28px;}
    .dest-block { margin: 14px 0 16px 0; background: #fff; color:#181c92; border-radius: 8px; padding: 16px; }
    .dest-name { font-weight: bold; font-size: 1.4em;}
    .passages { display: flex; gap: 16px; margin: 10px 0;}
    .passage { background: #181c92; color: #ffdc47; font-size: 2em; font-weight: bold; border-radius: 8px; padding: 12px 26px; min-width: 70px; display: flex; align-items: center; justify-content: center; }
    .marquee { overflow: hidden; white-space: nowrap; margin-top: 10px; }
    .marquee span { display: inline-block; padding-left: 100%; animation: marquee 12s linear infinite; }
    @keyframes marquee { 100% { transform: translate(-100%, 0); } }
    .service-info { margin-bottom: 10px; color: #bde5ff; font-size: 1em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
